<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H.Cube Hack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #17130f;
    --surface: #211a15;
    --surface-2: #2a221b;
    --border: #3a2f25;
    --text: #ece2d4;
    --text-dim: #a6988a;
    --text-faint: #6f6255;
    --accent: #d98c3f;
    --accent-dim: #8a5a2c;
    --cannot: #6f4040;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f;
      --surface: #211a15;
      --surface-2: #2a221b;
      --border: #3a2f25;
      --text: #ece2d4;
      --text-dim: #a6988a;
      --text-faint: #6f6255;
      --accent: #d98c3f;
      --accent-dim: #8a5a2c;
      --cannot: #6f4040;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f;
    --surface: #211a15;
    --surface-2: #2a221b;
    --border: #3a2f25;
    --text: #ece2d4;
    --text-dim: #a6988a;
    --text-faint: #6f6255;
    --accent: #d98c3f;
    --accent-dim: #8a5a2c;
    --cannot: #6f4040;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 48px 20px 80px;
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,140,63,0.08), transparent 60%);
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 36px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: "Cinzel", "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 10px;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  .sub {
    color: var(--text-dim);
    font-size: 14.5px;
    margin: 0;
    max-width: 60ch;
    margin-inline: auto;
    line-height: 1.6;
  }

  .search-shell { position: relative; margin: 32px auto 0; max-width: 560px; }
  #search {
    width: 100%;
    font-family: "Cinzel", serif;
    font-size: 19px;
    padding: 16px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    letter-spacing: 0.02em;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search::placeholder { color: var(--text-faint); font-family: "Inter", sans-serif; letter-spacing: normal; }
  #search:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(217,140,63,0.15);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 18px auto 0;
    max-width: 640px;
  }
  .chip {
    font-family: "Inter", sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .chip:hover { color: var(--text); border-color: var(--accent-dim); }
  .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }

  .result { margin-top: 40px; }
  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 14px;
    margin-top: 56px;
  }
  .empty b { color: var(--text-dim); }

  .item-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  .item-head h2 {
    font-family: "Cinzel", serif;
    font-size: 26px;
    margin: 0;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .item-head span {
    font-size: 12.5px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
  }
  .cat {
    background: linear-gradient(175deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 12px 28px -22px var(--c-glow, transparent);
  }
  .cat-rare    { --c-border: #7d611c; --c-text: #e8c568; --c-glow: rgba(232,197,104,0.4); }
  .cat-magic   { --c-border: #3a4d8f; --c-text: #9db3f2; --c-glow: rgba(157,179,242,0.35); }
  .cat-unique  { --c-border: #8a4a1c; --c-text: #e8935a; --c-glow: rgba(232,147,90,0.4); }
  .cat-rare, .cat-magic, .cat-unique { border-color: var(--c-border); }
  .cat.locked { opacity: 0.5; }

  .cat-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .cat-icon { color: var(--c-text, var(--text-faint)); flex: none; opacity: 0.9; }
  .cat-titles { flex: 1; min-width: 0; }
  .cat h3 {
    font-family: "Cinzel", serif;
    font-size: 15px;
    color: var(--c-text, var(--text-dim));
    margin: 0 0 3px;
    letter-spacing: 0.02em;
  }
  .cat-rarity {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--c-text, var(--text-faint));
    opacity: 0.8;
    margin: 0;
  }
  .cat-gem { flex: none; }
  .cat-effect {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 12px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--border);
  }
  .cat ul { margin: 0; padding: 0; list-style: none; }
  .cat li {
    font-size: 14px;
    line-height: 1.5;
    padding: 4px 0;
    color: var(--text);
  }
  .cat li + li { border-top: 1px dashed var(--border); }
  .cat.locked li { color: var(--text-faint); font-style: italic; }

  .note {
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    margin-top: 56px;
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    body { padding: 28px 16px 56px; }
    .item-head { flex-direction: column; align-items: flex-start; gap: 4px; }
    .eyebrow { font-size: 11px; }
    .sub { font-size: 14px; }
    #search { font-size: 17px; padding: 14px 16px; }
    .chip { font-size: 12.5px; padding: 8px 13px; }
    .cat { padding: 14px 16px; }
    .item-head h2 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">H.Cube Hack</p>
    <h1>Type a slot, see every roll</h1>
    <p class="sub">A condensed Horadric Cube tempering reference. Search a gear slot to see exactly what each manual can roll on it.</p>
  </header>

  <div class="search-shell">
    <input id="search" type="text" placeholder="Try: boots" autocomplete="off" spellcheck="false">
  </div>
  <div class="chips" id="chips"></div>

  <div class="result" id="result"></div>

  <footer>H.Cube Hack</footer>
</div>

<script>
  const DATA = {
    "Boots": {
      "Kullean": null,
      "Adept's": ["Main stat", "War Cry", "Leap", "Charge", "Kick", "Brawling"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat", "War Cry", "Leap", "Charge", "Kick", "Brawling"],
      "Pragmatic": ["Evade Grants Movement Speed", "Movement Speed", "Healing %", "(+) Maximum Evade Charges", "Life Regeneration", "Fortify Generation", "Barrier Generation"],
      "Protector's": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance", "Maximum Life", "Dodge Chance", "Life on Kill", "Armor", "Life Regeneration"],
      "Resourceful": ["Resource Regeneration"]
    },
    "Pants": {
      "Kullean": null,
      "Adept's": ["Main stat", "Lunging Strike", "Bash", "Flay", "Frenzy", "Basic"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat", "Thorns"],
      "Pragmatic": ["Life Regeneration", "Healing Percent", "Potion Capacity", "Thorns", "Fortify Generation", "Barrier Generation", "Impairment Reduction"],
      "Protector's": ["Dodge chance", "Maximum Life", "Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance", "Armor", "Life Regeneration", "Life on Kill", "Barrier Generation"],
      "Resourceful": ["Resource Cost Reduction", "Resource Regeneration"]
    },
    "Chest": {
      "Kullean": null,
      "Adept's": ["Main stat", "Skill Ranks"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat", "Thorns"],
      "Pragmatic": ["Thorns", "Healing Received", "Life Regeneration", "Fortify Generation", "Impairment Reduction", "Barrier Generation"],
      "Protector's": ["Maximum Life", "Life Regeneration", "Resistance to all Elements", "Armor", "Physical Resistance", "Fire Resistance", "Life on Kill", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Resourceful": ["Resource Cost Reduction", "Maximum Resources", "Resource Regeneration"]
    },
    "Helmet": {
      "Kullean": null,
      "Adept's": ["Main stat", "Skill Ranks"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat"],
      "Pragmatic": ["Thorns", "Healing Received", "Life Regeneration", "Resource Generation", "Cooldown Reduction", "Fortify Generation", "Lucky Hit Chance", "Impairment Reduction", "Barrier Generation"],
      "Protector's": ["Maximum Life", "Life Regeneration", "Resistance to all Elements", "Armor", "Physical Resistance", "Fire Resistance", "Life on Kill", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Resourceful": ["Resource Cost Reduction", "Maximum Resources", "Resource Regeneration", "Resource Generation"]
    },
    "Gloves": {
      "Kullean": null,
      "Adept's": ["Main stat", "Skill Ranks"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat", "Critical strike damage", "Physical Damage", "All Damage", "Critical Strike Chance", "Vulnerable Damage", "Attack Speed", "Fire Damage"],
      "Pragmatic": ["Life Regeneration", "Fortify Generation", "Cooldown Reduction"],
      "Protector's": ["Maximum Life", "Life on Hit", "Life on Kill"],
      "Resourceful": ["Fury on kill", "Resource Cost Reduction", "Chance to restore primary resource"]
    },
    "Ring": {
      "Kullean": null,
      "Adept's": ["Main stat"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat", "All Damage", "Critical Strike Chance", "Attack Speed", "Vulnerable Damage", "Damage over time", "Critical Strike Chance", "Phycical damage", "Damage over time"],
      "Pragmatic": ["Cooldown Reduction", "Life Regeneration", "Lucky hit chance"],
      "Protector's": ["Maximum Life", "All Resistances", "Armor", "Physical Resistance", "Fire Resistance", "Shadow Resistance", "Life on Hit", "Cold Resistance", "Poison Resistance"],
      "Resourceful": ["Fury on Kill", "Resource Cost Reduction", "Resource Generation", "Chance to restore primary resource"]
    },
    "Weapon": {
      "Kullean": null,
      "Adept's": ["Main stat"],
      "Chromatic": null,
      "Aggressive": ["Main stat", "Critical strike damage", "Physical Damage", "All Damage", "Fire Damage"],
      "Pragmatic": null,
      "Protector's": ["Maximum Life", "Life on Hit", "Life on Kill"],
      "Resourceful": ["Fury on kill", "Resource Cost Reduction", "Chance to restore primary resource"]
    },
    "Amulet": {
      "Kullean": ["All Utility Aspects"],
      "Adept's": ["Skill Ranks", "All Skill Ranks"],
      "Chromatic": ["Physical Resistance", "Fire Resistance", "Shadow Resistance", "Cold Resistance", "Poison Resistance"],
      "Aggressive": ["Main stat", "All Damage", "Critical Strike Chance", "Attack Speed", "Vulnerable Damage", "Damage over time", "Critical Strike Chance", "Phycical damage", "Damage over time"],
      "Pragmatic": ["Movement Speed", "Lucky hit chance", "Cooldown Reduction", "Life Regeneration"],
      "Protector's": ["Maximum Life", "Life on Hit", "Life on Kill"],
      "Resourceful": null
    }
  };

  const PRISMS = {
    "Adept's": {
      tier: "rare", rarity: "Rare Consumable",
      gem: ["#f2b06b", "#b8531f"],
      effect: "Used to target Skill and Core Stat affixes during Transmutations in the Horadric Cube."
    },
    "Chromatic": {
      tier: "rare", rarity: "Rare Consumable",
      gem: ["#bfe0ff", "#3d79c9"],
      effect: "Used to target Resistance affixes during Transmutations in the Horadric Cube."
    },
    "Aggressive": {
      tier: "magic", rarity: "Magic Consumable",
      gem: ["#f2909e", "#c23a4f"],
      effect: "Used to target Offensive affixes during Transmutations in the Horadric Cube."
    },
    "Pragmatic": {
      tier: "magic", rarity: "Magic Consumable",
      gem: ["#e8c568", "#6b46b3"],
      effect: "Used to target Mobility and Utility affixes during Transmutations in the Horadric Cube."
    },
    "Protector's": {
      tier: "magic", rarity: "Magic Consumable",
      gem: ["#d6f0ff", "#4f8fd6"],
      effect: "Used to target Defensive affixes during Transmutations in the Horadric Cube."
    },
    "Resourceful": {
      tier: "magic", rarity: "Magic Consumable",
      gem: ["#b6e8c8", "#3f9f63"],
      effect: "Used to target Resource affixes during Transmutations in the Horadric Cube."
    },
    "Kullean": {
      tier: "unique", rarity: "Unique Consumable",
      gem: ["#e2b25a", "#8a2f2f"],
      effect: "Only usable on Amulets. Used to influence Transfiguration outcomes in the Horadric Cube. Adds a random bonus Legendary Aspect. Allows the item to stay Modifiable after Transfiguration."
    }
  };

  function dieIcon() {
    return `<svg class="cat-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z"/>
      <path d="M12 2 L12 12 M3 7 L12 12 L21 7"/>
    </svg>`;
  }

  function gemIcon(id, c1, c2) {
    return `<svg class="cat-gem" width="24" height="24" viewBox="0 0 32 32">
      <defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
      </linearGradient></defs>
      <polygon points="16,2 28,12 16,30 4,12" fill="url(#g${id})" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
      <polygon points="16,2 22,12 16,18 10,12" fill="rgba(255,255,255,0.3)"/>
    </svg>`;
  }

  const names = Object.keys(DATA);
  const searchEl = document.getElementById("search");
  const chipsEl = document.getElementById("chips");
  const resultEl = document.getElementById("result");

  names.forEach(n => {
    const c = document.createElement("button");
    c.className = "chip";
    c.type = "button";
    c.textContent = n;
    c.addEventListener("click", () => {
      searchEl.value = n;
      render(n);
      searchEl.focus();
    });
    chipsEl.appendChild(c);
  });

  function findMatch(q) {
    const norm = q.trim().toLowerCase();
    if (!norm) return null;
    return names.find(n => n.toLowerCase() === norm) ||
           names.find(n => n.toLowerCase().startsWith(norm)) ||
           names.find(n => n.toLowerCase().includes(norm));
  }

  function render(query) {
    const match = findMatch(query);

    Array.from(chipsEl.children).forEach(c => {
      c.classList.toggle("active", match && c.textContent === match);
    });

    if (!query.trim()) {
      resultEl.innerHTML = `<p class="empty">Start typing, or pick a slot above &mdash; <b>${names.join(", ")}</b>.</p>`;
      return;
    }

    if (!match) {
      resultEl.innerHTML = `<p class="empty">No slot matches "<b>${escapeHtml(query)}</b>". Try one of: <b>${names.join(", ")}</b>.</p>`;
      return;
    }

    const cats = DATA[match];
    const cards = Object.entries(cats).map(([cat, list], i) => {
      if (!list) {
        return `<div class="cat locked"><h3>${cat}</h3><ul><li>Cannot use</li></ul></div>`;
      }
      const p = PRISMS[cat];
      const items = list.map(x => `<li>${escapeHtml(x)}</li>`).join("");
      return `
        <div class="cat cat-${p.tier}">
          <div class="cat-head">
            ${dieIcon()}
            <div class="cat-titles">
              <h3>${cat}</h3>
              <p class="cat-rarity">${escapeHtml(p.rarity)}</p>
            </div>
            ${gemIcon(`${match}-${i}`, p.gem[0], p.gem[1])}
          </div>
          <p class="cat-effect">${escapeHtml(p.effect)}</p>
          <ul>${items}</ul>
        </div>`;
    }).join("");

    resultEl.innerHTML = `
      <div class="item-head">
        <h2>${match}</h2>
        <span>${Object.values(cats).filter(Boolean).length} of 7 manuals usable</span>
      </div>
      <div class="grid">${cards}</div>
      <p class="note">Amulets only roll Utility aspects per class, and ranks are class based.<br>Main stats are Dexterity, Intelligence, Strength and Willpower.</p>
    `;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  searchEl.addEventListener("input", () => render(searchEl.value));
  render("Boots");
  searchEl.value = "Boots";
</script>
</body>
</html>
